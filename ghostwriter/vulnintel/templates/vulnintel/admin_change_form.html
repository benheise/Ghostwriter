{% extends "admin/change_form.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .object-tool-form {
            display: contents;
        }
        .object-tool-form input {
            padding: 3px 12px;
            background-color: var(--object-tools-bg);
            color: var(--object-tools-fg);
            border-radius: 15px;
            font-weight: 400;
            font-size: 0.6875rem;
            text-transform: uppercase;
            line-height: 1.25rem;
            margin: 0;
            border: 0;
            cursor: pointer;
        }
    </style>
{% endblock %}

{% block object-tools-items %}
    {{ block.super }}
    <li>
        <form action="{% url 'admin:vulnintel_vulnintelconfiguration_refresh' %}" method="POST" class="object-tool-form">
            {% csrf_token %}
            <input type="submit" value="Refresh Now" />
        </form>
    </li>
{% endblock %}
